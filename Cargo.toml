[workspace]
members = [
    "filesystem-trustfall-adapter",
    "openapi-trustfall-adapter",
    "terraform-trustfall-adapter",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
trustfall = "0.8.1"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "1.0.58"
anyhow = "1.0.104"
hcl-rs = "0.19.9"
openapiv3 = "2.0.0"
serde_yaml = "0.9.34"
sha256 = "1.6.0"
yaml-hash = "0.3.0"
